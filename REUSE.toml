version = 1
SPDX-PackageName = "sdlc-foundry"
SPDX-PackageDownloadLocation = "https://github.com/ika100/sdlc-foundry"

# Everything is Apache-2.0 unless a more specific annotation below says otherwise (REUSE specification 3.x).
[[annotations]]
path = "**"
precedence = "aggregate"
SPDX-FileCopyrightText = "2026 Eike Hensler and sdlc-foundry contributors"
SPDX-License-Identifier = "Apache-2.0"

[[annotations]]
path = "CODE_OF_CONDUCT.md"
precedence = "override"
SPDX-FileCopyrightText = "2021 Organization for Ethical Source (Contributor Covenant 2.1)"
SPDX-License-Identifier = "CC-BY-4.0"

[[annotations]]
path = "templates/web-nextjs/app/_components/icons.tsx"
precedence = "override"
SPDX-FileCopyrightText = ["2026 Eike Hensler and sdlc-foundry contributors", "2026 Lucide Icons and Contributors"]
SPDX-License-Identifier = "Apache-2.0 AND ISC"
