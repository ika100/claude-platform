services:
  - name: fx-api
    repo: acme/fx-api
    shape: service-java
    image: ghcr.io/acme/fx-api
    port: 8080
    probes: {liveness: /actuator/health/liveness, readiness: /actuator/health/readiness}
    user: 65532
    volumes: {tmp: /tmp}
    env: {LOG_LEVEL: INFO}
    replicas: {dev: 1, staging: 2}
    resources: {requests: {cpu: 200m, memory: 384Mi}, limits: {cpu: 1000m, memory: 768Mi}}
    environments: [dev, staging]
  - name: fx-web
    repo: acme/fx-web
    shape: web-nextjs
    image: ghcr.io/acme/fx-web
    port: 3000
    probes: {liveness: /api/health, readiness: /api/ready}
    user: 1000
    volumes: {tmp: /tmp, next-cache: /app/.next/cache}
    env: {NODE_ENV: production, API_URL: "http://fx-api"}
    secretRefs: [fx-web-secrets]
    replicas: 1
    resources: {requests: {cpu: 100m, memory: 192Mi}, limits: {cpu: 1000m, memory: 512Mi}}
    expose: {host: fx-web}
    environments: [dev]
