name: ci

on:
  push:
    branches:
      - 'feature/**'
      - 'fix/**'
      - 'chore/**'
      - 'docs/**'
      - 'refactor/**'
      - 'perf/**'
      - 'test/**'
      - 'release/**'
    tags:
      - 'v*.*.*'
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  quality:
    name: quality (ruff + mypy)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: jetify-com/devbox-install-action@v0.15.0
        with:
          enable-cache: true
      - run: devbox run quality

  test:
    name: test (pytest + coverage)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: jetify-com/devbox-install-action@v0.15.0
        with:
          enable-cache: true
      - run: devbox run test

  security:
    name: security (pip-audit + detect-secrets + bandit)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: jetify-com/devbox-install-action@v0.15.0
        with:
          enable-cache: true
      - run: devbox run security

  pr-title:
    name: pr-title (conventional commits)
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - name: Validate PR title
        env:
          PR_TITLE: ${{ '{{' }} github.event.pull_request.title {{ '}}' }}
        run: |
          pattern='^(feat|fix|docs|style|refactor|perf|test|chore|ci|build|revert)(\(.+\))?: .{1,72}$'
          if ! echo "$PR_TITLE" | grep -qE "$pattern"; then
            echo "ERROR: PR title does not follow Conventional Commits."
            echo "  Got:     $PR_TITLE"
            echo "  Pattern: type(scope): description (≤72 chars)"
            echo "  Example: feat(api): add /health endpoint"
            exit 1
          fi
          echo "OK: PR title is valid."

  branch-name:
    name: branch-name (naming convention)
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    continue-on-error: true
    steps:
      - name: Validate branch name
        env:
          BRANCH: ${{ '{{' }} github.head_ref {{ '}}' }}
        run: |
          pattern='^(feature|fix|chore|docs|refactor|perf|test|release)/.+'
          if ! echo "$BRANCH" | grep -qE "$pattern"; then
            echo "WARNING: Branch does not follow naming convention."
            echo "  Got:      $BRANCH"
            echo "  Expected: type/slug — e.g. feature/add-health-endpoint"
            echo "  This warning does not block the PR."
          else
            echo "OK: Branch name is valid."
          fi

  docker:
    name: docker (build + push)
    runs-on: ubuntu-latest
    needs: [quality, test]
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v5

      - uses: docker/setup-buildx-action@v3

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ '{{' }} github.repository {{ '}}' }}
          tags: |
            type=semver,pattern={{ '{{' }}version{{ '}}' }}
            type=semver,pattern={{ '{{' }}major{{ '}}' }}.{{ '{{' }}minor{{ '}}' }}
            type=semver,pattern={{ '{{' }}major{{ '}}' }}
            type=sha,prefix=sha-,format=short
            type=raw,value=latest,enable={{ '{{' }}is_default_branch{{ '}}' }}

      - uses: docker/login-action@v3
        if: github.event_name != 'pull_request'
        with:
          registry: ghcr.io
          username: ${{ '{{' }} github.actor {{ '}}' }}
          password: ${{ '{{' }} secrets.GITHUB_TOKEN {{ '}}' }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          push: ${{ '{{' }} github.event_name != 'pull_request' {{ '}}' }}
          tags: ${{ '{{' }} steps.meta.outputs.tags {{ '}}' }}
          labels: ${{ '{{' }} steps.meta.outputs.labels {{ '}}' }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
