# Weekly dependency PRs: the language ecosystem, the GitHub Actions used by CI, and the Docker base images.
# The Node major is a platform decision (ADR-005: one pinned LTS, bumped through `/shared:update-service`), so Dependabot
# must not move the Docker image or the matching @types/node to another major on its own.
version: 2
updates:
  - package-ecosystem: npm
    directory: "/"
    schedule: {interval: weekly}
    open-pull-requests-limit: 5
    ignore:
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]
  - package-ecosystem: github-actions
    directory: "/"
    schedule: {interval: weekly}
  - package-ecosystem: docker
    directory: "/"
    schedule: {interval: weekly}
    ignore:
      - dependency-name: "node"
        update-types: ["version-update:semver-major"]
